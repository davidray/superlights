<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Superlights Simulator</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <div class="canvas-wrap">
        <canvas id="scene-canvas" width="900" height="675"></canvas>
        <div id="status-overlay" class="status-overlay" hidden></div>
      </div>

      <div class="controls">
        <select id="scene-select"></select>
        <p id="scene-description" class="description"></p>
        <div class="spacer"></div>
        <button id="reload-button" type="button">Reload</button>
      </div>
    </main>
  </body>
</html>
